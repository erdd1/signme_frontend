name: eecsigncard1
description: "EEC SignCard — Application de signature de carte Sainte Cène"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── Navigation ────────────────────────────────────────────────────────
  go_router: ^14.2.7

  # ── State Management ──────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── HTTP & Networking ─────────────────────────────────────────────────
  dio: ^5.4.3+1

  # ── Secure Storage ────────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2

  # ── Local Storage ─────────────────────────────────────────────────────
  shared_preferences: ^2.3.2

  # ── UI & Design ───────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  image_picker: ^1.0.0

  # ── Utils ─────────────────────────────────────────────────────────────
  intl: ^0.20.2
  equatable: ^2.0.5
  dartz: ^0.10.1
  timeago: ^3.6.1

  # ── JSON Serialization ────────────────────────────────────────────────
  json_annotation: ^4.8.1

  # ── Icons ─────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
