name: signme
description: "SignMe — Application de signature de documents"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── Navigation ────────────────────────────────────────────────────────
  go_router: ^14.2.7
  app_links: ^6.4.0

  # ── State Management ──────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── HTTP & Networking ─────────────────────────────────────────────────
  dio: ^5.4.3+1
  url_launcher: ^6.3.1

  # ── Export PDF (téléchargement local des rapports) ──────────────────────
  open_filex: ^4.5.0

  # ── Partage (lien d'événement vers WhatsApp, etc.) ───────────────────────
  share_plus: ^10.1.2

  # ── Notifications push (Firebase Cloud Messaging) ──────────────────────
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  flutter_timezone: ^3.0.1

  # ── Remontée automatique des crashs (production) ────────────────────────
  firebase_crashlytics: ^4.1.5

  # ── Offline-First : Base de données locale ────────────────────────────
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1   # librairies natives Isar (Rust)
  path_provider: ^2.1.4          # chemin du répertoire Isar

  # ── Offline-First : Connectivité ─────────────────────────────────────
  connectivity_plus: ^6.1.4

  # ── Secure Storage ────────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2

  # ── Authentification sociale ──────────────────────────────────────────
  google_sign_in: ^6.2.1

  # ── UI & Design ───────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  image_picker: ^1.0.0
  pinput: ^4.0.0

  # ── Utils ─────────────────────────────────────────────────────────────
  intl: ^0.20.2
  equatable: ^2.0.5
  dartz: ^0.10.1
  timeago: ^3.6.1

  # ── JSON Serialization ────────────────────────────────────────────────
  json_annotation: ^4.8.1

  # ── Icons ─────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0

  # ── Animations (module Célébrations) ────────────────────────────────
  confetti: ^0.8.0
  youtube_player_iframe: ^5.2.2
  webview_flutter_wkwebview: ^3.25.0
  webview_flutter_android: ^4.12.0
  webview_flutter: ^4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  isar_generator: ^3.1.0+1      # génération des schémas Isar
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icones/

# ── Icône de l'application (générée via `dart run flutter_launcher_icons`) ──
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icones/logo_signme.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icones/logo_signme.png"
  remove_alpha_ios: true
